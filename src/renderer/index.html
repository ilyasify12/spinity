<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP notes:
      - img-src https: is required for YouTube thumbnails (i.ytimg.com).
      - media-src spinity: is required for local audio streaming via the
        privileged custom protocol registered in src/main/index.ts.
      - 'unsafe-inline' for script/style keeps Vite's dev-mode HMR working.
        Tighten this before shipping a production build.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data: spinity:; media-src 'self' spinity: https://*.googlevideo.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss: http://localhost:*"
    />
    <title>Spinity</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
