<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Spinity Web</title>
<link rel="manifest" href="/player/manifest.webmanifest" />
<meta name="theme-color" content="#0b0e17" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Spinity" />
<link rel="icon" href="/player/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/player/icons/apple-touch-icon.png" />
<style>
/* Mirrors src/renderer/src/styles.css — same tokens, same components. */
:root {
  --bg:#000; --bg-elev:#121212; --bg-elev-2:#1a1a1a; --bg-elev-3:#2a2a2a;
  --border:transparent; --text:#fff; --text-dim:#b3b3b3; --text-faint:#6a6a6a;
  --accent:#FF6B00; --accent-dim:#FF6B00; --danger:#f15e6c; --warn:#f5a524;
  --radius:8px; --player-h:88px; --topbar-h:64px; --rail-w:300px; --right-w:300px;
}
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:14px; overflow:hidden; user-select:none; display:flex; flex-direction:column; }
button { font-family:inherit; font-size:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input, select { font-family:inherit; font-size:inherit; }
::-webkit-scrollbar { width:12px; }
::-webkit-scrollbar-thumb { background:#4d4d4d; border-radius:0; border:3px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover { background:#6a6a6a; background-clip:content-box; border:3px solid transparent; }
::-webkit-scrollbar-track { background:transparent; }

.sp-app { display:grid; grid-template-columns:var(--rail-w) 1fr var(--right-w); grid-template-rows:1fr auto; grid-template-areas:'rail center right' 'player player player'; flex:1; min-height:0; gap:8px; padding:8px; background:#000; }
#app { flex:1; min-height:0; display:flex; flex-direction:column; }
#bar { flex:none; }
.sp-rail { grid-area:rail; display:flex; flex-direction:column; gap:8px; min-height:0; overflow:hidden; }
.sp-rail-card { background:var(--bg-elev); border-radius:var(--radius); padding:8px 12px; }
.sp-logo { display:flex; align-items:center; gap:10px; padding:12px 12px 10px; font-size:20px; font-weight:800; letter-spacing:-.5px; }
.sp-logo-dot { width:30px; height:30px; border-radius:50%; background:var(--accent); display:grid; place-items:center; color:#000; font-size:16px; font-weight:900; flex:none; }
.nav-btn { display:flex; align-items:center; gap:16px; padding:8px 12px; border-radius:4px; color:var(--text-dim); font-weight:700; font-size:15px; text-align:left; width:100%; transition:color .15s; }
.nav-btn:hover { color:var(--text); }
.nav-btn.active { color:var(--text); }
.nav-badge { margin-left:auto; background:var(--accent); color:#000; font-size:11px; font-weight:800; border-radius:10px; padding:1px 7px; }
.sp-library { background:var(--bg-elev); border-radius:var(--radius); flex:1; min-height:0; display:flex; flex-direction:column; padding:8px; overflow:hidden; }
.sp-library-head { display:flex; align-items:center; gap:8px; padding:8px 12px; color:var(--text-dim); font-weight:700; font-size:15px; }
.sp-create-pill { display:flex; align-items:center; gap:6px; background:var(--bg-elev-2); border-radius:16px; padding:7px 13px; font-size:13px; font-weight:700; color:var(--text-dim); margin-left:auto; }
.sp-create-pill:hover { background:var(--bg-elev-3); color:var(--text); transform:scale(1.03); }
.sp-chips { display:flex; gap:8px; padding:2px 8px 8px; }
.sp-chip { background:#2a2a2a; border-radius:16px; padding:6px 13px; font-size:13px; font-weight:600; color:var(--text); }
.sp-library-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
.sp-lib-row { display:flex; align-items:center; gap:12px; padding:8px; border-radius:6px; text-align:left; width:100%; }
.sp-lib-row:hover { background:var(--bg-elev-2); }
.sp-lib-row.active { background:var(--bg-elev-3); }
.sp-lib-art { width:48px; height:48px; border-radius:4px; flex:none; overflow:hidden; background:#333; display:grid; place-items:center; color:var(--text-dim); font-weight:800; }
.sp-lib-art img { width:100%; height:100%; object-fit:cover; display:block; }
.sp-lib-meta { min-width:0; flex:1; }
.sp-lib-title { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp-lib-sub { color:var(--text-dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp-lib-tile-liked { width:100%; height:100%; display:grid; place-items:center; background:linear-gradient(135deg,#4b3ec4,#8b9aef); color:#fff; border-radius:4px; font-size:20px; }
.sidebar-user { display:flex; align-items:center; gap:10px; padding:10px 12px; }
.avatar { width:28px; height:28px; border-radius:50%; background:#535353; display:grid; place-items:center; font-weight:700; font-size:12px; color:#fff; flex:none; }

.sp-center { grid-area:center; display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg-elev); border-radius:var(--radius); overflow:hidden; }
.sp-topbar { height:var(--topbar-h); display:flex; align-items:center; gap:8px; padding:0 8px 0 24px; flex:none; }
.sp-nav-arrow { width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,.7); color:var(--text-dim); display:grid; place-items:center; }
.sp-home-btn { width:48px; height:48px; border-radius:50%; background:var(--bg-elev-2); color:var(--text-dim); display:grid; place-items:center; flex:none; font-size:19px; }
.sp-home-btn:hover, .sp-home-btn.active { color:var(--text); transform:scale(1.04); }
.sp-search-pill { display:flex; align-items:center; gap:10px; background:var(--bg-elev-2); border:1px solid transparent; border-radius:24px; padding:0 16px; height:48px; width:100%; max-width:480px; color:var(--text-dim); }
.sp-search-pill:hover { background:#2a2a2a; border-color:#333; }
.sp-search-pill input { flex:1; min-width:0; background:none; border:none; outline:none; color:var(--text); font-size:14px; user-select:text; }
.sp-search-pill input::placeholder { color:var(--text-faint); }
.sp-topbar-right { margin-left:auto; display:flex; align-items:center; gap:8px; flex:none; }
.sp-page { flex:1; overflow-y:auto; padding:8px 24px 24px; min-height:0; }

.page-title { font-size:30px; font-weight:800; letter-spacing:-.8px; margin:8px 0 4px; }
.page-sub { color:var(--text-dim); margin:0 0 20px; font-size:14px; }
.searchbar { display:flex; gap:10px; margin-bottom:20px; }
.searchbar input { flex:1; background:var(--bg-elev-2); border:1px solid #333; color:var(--text); border-radius:6px; padding:12px 16px; outline:none; user-select:text; font-size:14px; }
.searchbar input:focus { border-color:#fff; }
.btn { background:#fff; color:#000; font-weight:700; font-size:14px; border-radius:24px; padding:10px 24px; transition:transform .1s; }
.btn:hover { transform:scale(1.03); }
.btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }
.btn-ghost { background:transparent; color:var(--text); border:1px solid #727272; border-radius:24px; }
.btn-ghost:hover { border-color:#fff; transform:scale(1.03); }
.btn-sm { padding:7px 15px; font-size:13px; border-radius:16px; }
.btn-danger { background:transparent; border:1px solid var(--danger); color:var(--danger); border-radius:24px; }
.btn-danger:hover { transform:scale(1.03); }

.sp-greet { font-size:30px; font-weight:800; letter-spacing:-.8px; margin:8px 0 16px; }
.sp-quick-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:28px; }
.sp-quick { display:flex; align-items:center; gap:0; background:rgba(255,255,255,.07); border-radius:6px; overflow:hidden; height:64px; text-align:left; position:relative; }
.sp-quick:hover { background:rgba(255,255,255,.14); }
.sp-quick img { width:64px; height:64px; object-fit:cover; flex:none; background:#333; }
.sp-quick .q-fallback { width:64px; height:64px; flex:none; display:grid; place-items:center; font-weight:800; font-size:22px; color:#000; background:var(--accent); }
.sp-quick span.qt { padding:0 12px; font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp-quick .sp-quick-play { position:absolute; right:8px; width:44px; height:44px; border-radius:50%; background:var(--accent); color:#000; display:grid; place-items:center; opacity:0; transform:translateY(4px); transition:opacity .15s,transform .15s; font-size:15px; }
.sp-quick:hover .sp-quick-play { opacity:1; transform:none; }
.sp-section-head { display:flex; align-items:baseline; margin:0 0 12px; }
.sp-section-head h2 { margin:0; font-size:22px; font-weight:800; letter-spacing:-.4px; }
.sp-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:32px; }
.sp-card { background:#181818; border-radius:8px; padding:14px; text-align:left; position:relative; transition:background .2s; min-width:0; }
.sp-card:hover { background:#282828; }
.sp-card img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; margin-bottom:12px; background:#333; display:block; }
.sp-card .card-fallback { width:100%; aspect-ratio:1; border-radius:6px; margin-bottom:12px; background:linear-gradient(135deg,#4b3ec4,#8b9aef); display:grid; place-items:center; font-size:40px; font-weight:800; color:#fff; }
.sp-card b { display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp-card span { color:var(--text-dim); font-size:13px; }

.track-list { display:flex; flex-direction:column; }
.track-row { display:grid; grid-template-columns:40px 48px 1fr 90px 40px auto; align-items:center; gap:12px; padding:7px 12px; border-radius:6px; }
.track-row:hover { background:rgba(255,255,255,.08); }
.track-row.playing .track-title { color:var(--accent); }
.track-index { color:var(--text-dim); text-align:center; font-variant-numeric:tabular-nums; font-size:14px; display:grid; place-items:center; height:32px; }
.track-index .idx-play { display:none; color:var(--text); font-size:13px; }
.track-row:hover .idx-num { display:none; }
.track-row:hover .idx-play { display:block; }
.track-thumb { width:48px; height:48px; border-radius:4px; object-fit:cover; background:#333; display:block; }
.track-main { min-width:0; }
.track-title, .track-artist { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.track-title { font-weight:500; font-size:15px; }
.track-artist { color:var(--text-dim); font-size:13px; }
.track-artist a { color:inherit; text-decoration:none; cursor:pointer; }
.track-artist a:hover { color:var(--text); text-decoration:underline; }
.track-dur { color:var(--text-dim); font-variant-numeric:tabular-nums; text-align:right; font-size:13px; }
.row-actions { display:flex; gap:8px; opacity:0; align-items:center; }
.track-row:hover .row-actions, .track-row:focus-within .row-actions { opacity:1; }
.like-btn { display:grid; place-items:center; color:var(--text-dim); padding:6px; border-radius:50%; font-size:15px; }
.like-btn:hover { color:var(--text); transform:scale(1.06); }
.like-btn.liked { color:var(--accent); opacity:1 !important; }
.chip { display:inline-block; padding:3px 10px; border-radius:12px; background:var(--bg-elev-2); border:1px solid #333; color:var(--text-dim); font-size:11px; font-weight:700; }
.chip-ok { color:var(--accent); border-color:rgba(255,107,0,.45); }
.chip-err { color:var(--danger); border-color:rgba(241,94,108,.4); }
.codec-tag { font-size:10px; font-weight:700; letter-spacing:.4px; color:var(--text-faint); border:1px solid rgba(255,255,255,.14); border-radius:4px; padding:1px 5px; white-space:nowrap; vertical-align:1px; }

.pl-detail { min-width:0; background:rgba(255,255,255,.02); border-radius:var(--radius); overflow:hidden; }
.pl-hero { display:flex; align-items:flex-end; gap:20px; padding:28px 24px 20px; }
.pl-hero-art { width:180px; height:180px; border-radius:6px; overflow:hidden; flex:none; background:rgba(0,0,0,.35); display:grid; place-items:center; box-shadow:0 16px 48px rgba(0,0,0,.5); }
.pl-hero-art img { width:100%; height:100%; object-fit:cover; display:block; }
.pl-hero-heart { display:grid; place-items:center; color:#fff; opacity:.9; font-size:64px; width:100%; height:100%; background:linear-gradient(135deg,#4b3ec4,#8b9aef); }
.pl-hero-letter { font-size:84px; font-weight:900; color:rgba(255,255,255,.85); }
.pl-hero-meta { min-width:0; padding-bottom:4px; }
.pl-hero-type { font-size:13px; font-weight:600; }
.pl-hero-title { margin:4px 0 10px; font-size:clamp(32px,5vw,64px); font-weight:900; letter-spacing:-1.5px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pl-hero-sub { color:rgba(255,255,255,.75); font-size:13px; font-weight:600; }
.pl-actions { display:flex; align-items:center; gap:20px; padding:16px 24px; }
.pl-play { width:52px; height:52px; border-radius:50%; background:var(--accent); color:#000; display:grid; place-items:center; font-size:19px; }
.pl-play:hover { transform:scale(1.05); background:#FF7A1A; }
.pl-table { padding:0 24px 24px; }
.pl-table-head, .pl-table-row { display:grid; grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 56px 36px 36px; align-items:center; gap:12px; }
.pl-table-head { color:var(--text-dim); font-size:12px; padding:8px 12px; border-bottom:1px solid #2a2a2a; margin-bottom:8px; }
.pl-table-row { padding:7px 12px; border-radius:6px; cursor:pointer; }
.pl-table-row:hover { background:rgba(255,255,255,.08); }
.pl-table-row.playing .track-title { color:var(--accent); }
.pl-num { color:var(--text-dim); text-align:center; font-size:14px; display:grid; place-items:center; height:32px; }
.pl-num .mini-play { display:none; color:var(--text); font-size:12px; }
.pl-table-row:hover .num { display:none; }
.pl-table-row:hover .mini-play { display:block; }
.pl-album { color:var(--text-dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pl-dur { color:var(--text-dim); font-size:13px; text-align:right; font-variant-numeric:tabular-nums; }
.mini-play { display:grid; place-items:center; width:32px; height:32px; border-radius:50%; }

.player { grid-area:player; background:#000; height:var(--player-h); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding:0 12px; }
.now-playing { display:flex; align-items:center; gap:12px; min-width:0; }
.now-playing .track-title { font-size:13px; }
.now-playing .track-artist { font-size:11px; }
.now-artwork { width:56px; height:56px; border-radius:4px; flex:none; object-fit:cover; background:#333; display:block; }
.player-mid { display:flex; flex-direction:column; align-items:center; gap:4px; width:min(560px,40vw); }
.player-controls { display:flex; align-items:center; gap:20px; }
.ctrl { color:var(--text-dim); display:grid; place-items:center; padding:4px; border-radius:50%; font-size:15px; }
.ctrl:hover { color:var(--text); }
.ctrl.on { color:var(--accent); }
.ctrl-play { width:36px; height:36px; border-radius:50%; background:#fff; color:#000; display:grid; place-items:center; font-size:14px; }
.ctrl-play:hover { transform:scale(1.05); color:#000; }
.progress-wrap { display:flex; align-items:center; gap:8px; width:100%; }
.time { color:var(--text-dim); font-size:11px; font-variant-numeric:tabular-nums; min-width:36px; text-align:center; }
.waveform { flex:1; display:flex; align-items:center; gap:2px; height:32px; min-width:0; cursor:pointer; outline-offset:4px; }
.wave-bar { flex:1 1 0; min-width:1px; background:#4d4d4d; border-radius:1px; }
.wave-bar.played { background:var(--accent); }
.wave-flat { flex:1; height:6px; min-width:0; border-radius:3px; cursor:pointer; }
.player-right { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
.player-right input[type=range] { width:96px; flex:none; }
input[type=range] { -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; background:#4d4d4d; flex:1; outline:none; cursor:pointer; }
input[type=range]:hover { background:var(--accent); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#fff; cursor:pointer; opacity:0; }
.progress-wrap:hover input[type=range]::-webkit-slider-thumb, .player-right input[type=range]::-webkit-slider-thumb { opacity:1; }

.sp-right { grid-area:right; background:var(--bg-elev); border-radius:var(--radius); overflow-y:auto; padding:20px 16px; min-height:0; }
.sp-right h3 { margin:0 0 12px; font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp-np-art { border-radius:8px; overflow:hidden; background:#222; aspect-ratio:1; display:grid; place-items:center; color:var(--text-faint); font-size:48px; }
.sp-np-art img { width:100%; height:100%; object-fit:cover; display:block; }
.sp-np-title { font-size:22px; font-weight:800; letter-spacing:-.4px; margin:16px 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp-np-artist { color:var(--text-dim); font-size:14px; margin-bottom:16px; }
.sp-next-row { display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:6px; width:100%; text-align:left; }
.sp-next-row:hover { background:var(--bg-elev-2); }
.sp-next-row img { width:40px; height:40px; border-radius:4px; object-fit:cover; background:#333; flex:none; }

.card { background:var(--bg-elev-2); border-radius:var(--radius); padding:20px; max-width:680px; }
.field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.field label { font-size:12px; font-weight:700; color:var(--text-dim); }
.field input, .field select { background:#2a2a2a; border:1px solid #333; color:var(--text); border-radius:6px; padding:10px 13px; outline:none; user-select:text; }
.field input:focus, .field select:focus { border-color:#fff; }
.error-text { color:var(--danger); font-size:13px; margin:0 0 12px; }
.hint { color:var(--text-dim); font-size:12.5px; line-height:1.55; }
.empty { color:var(--text-faint); text-align:center; padding:54px 20px; }
.empty strong { color:var(--text-dim); }
.login-wrap { height:100vh; display:grid; place-items:center; background:#000; overflow-y:auto; }
.login-card { width:400px; max-width:92vw; background:var(--bg-elev); border-radius:12px; padding:32px; margin:30px 0; }
.login-card h1 { font-size:24px; font-weight:800; letter-spacing:-.5px; text-align:center; margin:6px 0 4px; }
.login-tabs { display:flex; gap:8px; margin:18px 0 16px; }
.login-tabs button { flex:1; padding:9px; border-radius:6px; color:var(--text-dim); font-weight:700; }
.login-tabs button.on { background:var(--bg-elev-3); color:var(--text); }
.ctx-menu { position:fixed; z-index:60; width:240px; background:#222; border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:6px; box-shadow:0 16px 44px rgba(0,0,0,.65); }
.ctx-item { display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:8px 10px; border-radius:6px; font-size:13px; color:var(--text); }
.ctx-item:hover:not(:disabled) { background:rgba(255,255,255,.09); }
.ctx-item:disabled { opacity:.4; cursor:default; }
.ctx-item.danger { color:#f6878f; }
.toast { position:fixed; bottom:calc(var(--player-h) + 16px); left:50%; transform:translateX(-50%); background:#2a2a2a; border-radius:8px; padding:12px 20px; z-index:50; max-width:560px; box-shadow:0 8px 24px rgba(0,0,0,.6); }
.toast.error { background:#5a1f26; color:#ffc9cb; }
@media (max-width:1150px) { .sp-app { grid-template-columns:var(--rail-w) 1fr; grid-template-areas:'rail center' 'player player'; } .sp-right { display:none; } }

/* ---- Mobile-only chrome: hidden on desktop ---- */
.tabbar { display:none; }
.mb-progress { display:none; }
.mb-like { display:none; }
#np { display:none; }

/* ---- Phone shell (≤780px) ---- */
@media (max-width:780px) {
  :root { --player-h:60px; --tabbar-h:54px; }
  body { -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  html, body { height:100dvh; }
  .sp-app { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto auto; grid-template-areas:'center' 'player' 'tabs'; gap:0; padding:0; background:var(--bg); }
  .sp-rail, .sp-right { display:none; }
  .sp-center { border-radius:0; background:transparent; }
  .sp-topbar { height:54px; padding:0 12px; gap:8px; position:sticky; top:0; z-index:20; background:rgba(7,8,13,.6); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
  .sp-nav-arrow, .sp-home-btn { display:none; }
  .sp-search-pill { height:42px; }
  .sp-page { padding:4px 14px 28px; overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch; }

  .sp-greet { font-size:22px; margin:10px 0 14px; }
  .sp-quick-grid { gap:6px; margin-bottom:22px; }
  .sp-quick { height:56px; }
  .sp-quick img, .sp-quick .q-fallback { width:56px; height:56px; }
  .sp-section-head h2 { font-size:18px; }
  .sp-cards { grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:10px; margin-bottom:24px; }
  .page-title { font-size:24px; margin:12px 0 4px; }
  .page-sub { margin-bottom:14px; }

  /* Track rows: index, art, title; duration hidden, actions always visible */
  .track-row { grid-template-columns:28px 48px minmax(0,1fr) auto auto; gap:10px; padding:7px 4px; }
  .track-row .track-dur { display:none; }
  .like-btn { padding:9px; font-size:16px; }
  .row-actions, .pl-table .row-actions { opacity:1; }

  /* Playlist / artist pages stack vertically */
  .pl-hero { flex-direction:column; align-items:flex-start; gap:14px; padding:14px 4px 10px; }
  .pl-hero-art { width:128px; height:128px; }
  .pl-hero-title { font-size:30px; white-space:normal; }
  .pl-actions { gap:14px; padding:10px 4px 14px; }
  .pl-play { width:48px; height:48px; }
  .pl-table { padding:0 0 16px; }
  .pl-table-head { display:none; }
  .pl-table-row { grid-template-columns:26px minmax(0,1fr) auto auto; gap:10px; padding:8px 4px; }
  .pl-table-row .pl-album, .pl-table-row .pl-dur { display:none; }
  .pl-table .track-thumb { width:44px; height:44px; }

  /* Library page rows */
  .lib-page { display:flex; flex-direction:column; gap:2px; }
  .lib-page .sp-lib-row { padding:10px 6px; }

  /* Mini player bar */
  .player { position:relative; height:calc(var(--player-h) + env(safe-area-inset-bottom)); padding:0 10px env(safe-area-inset-bottom); grid-template-columns:minmax(0,1fr) auto; gap:6px; background:#101218; border-top:1px solid rgba(255,255,255,.07); }
  .player .now-playing { gap:10px; }
  .now-artwork { width:44px; height:44px; }
  .mb-like { display:grid; }
  .mb-progress { display:block; position:absolute; top:0; left:0; right:0; height:2px; background:transparent; }
  .player-mid { width:auto; gap:0; }
  .player-mid .progress-wrap { display:none; }
  .player-controls { gap:6px; }
  #btn-shuf, #btn-rep, #btn-prev { display:none; }
  .ctrl { padding:8px; }
  .ctrl-play { width:42px; height:42px; font-size:15px; }
  .player-right { display:none; }

  /* Tab bar */
  .tabbar { display:grid; grid-area:tabs; grid-template-columns:repeat(3,1fr); height:calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom); background:#0b0c11; border-top:1px solid rgba(255,255,255,.07); }
  .tabbtn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--text-dim); font-size:10.5px; font-weight:700; letter-spacing:.2px; }
  .tabbtn.on { color:var(--accent); }
  .tabbtn svg { display:block; }

  /* Toast above mini player + tab bar */
  .toast { bottom:calc(var(--player-h) + var(--tabbar-h) + 14px + env(safe-area-inset-bottom)); max-width:92vw; }

  .login-wrap { height:100dvh; }
  .login-card { padding:24px 20px; }

  /* ---- Now Playing sheet ---- */
  #np { display:block; position:fixed; inset:0; z-index:70; background:#0d0f16; visibility:hidden; transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s linear .3s; will-change:transform; }
  #np.open { visibility:visible; transform:none; transition:transform .3s cubic-bezier(.2,.8,.2,1); }
  .np-bg { position:absolute; inset:-60px; background-size:cover; background-position:center; filter:blur(80px) saturate(1.5) brightness(.55); opacity:.9; pointer-events:none; }
  .np-scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(13,15,22,.55) 0%, rgba(13,15,22,.86) 55%, #0d0f16 100%); pointer-events:none; }
  .np-sheet { position:relative; display:flex; flex-direction:column; height:100%; padding:0 20px calc(16px + env(safe-area-inset-bottom)); }
  .np-head { flex:none; display:grid; grid-template-columns:36px 1fr 36px; align-items:center; padding:10px 0 4px; touch-action:none; cursor:grab; }
  .np-head::before { content:''; position:absolute; top:6px; left:50%; transform:translateX(-50%); width:38px; height:4px; border-radius:2px; background:rgba(255,255,255,.28); }
  .np-head-title { text-align:center; font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--text-dim); }
  .np-btn { display:grid; place-items:center; width:36px; height:36px; border-radius:50%; color:var(--text); }
  .np-btn:active { background:rgba(255,255,255,.08); }
  .np-scroll { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; display:flex; flex-direction:column; }
  .np-art { width:min(78vw,320px); aspect-ratio:1; margin:10px auto 18px; border-radius:14px; overflow:hidden; background:#222; box-shadow:0 24px 60px rgba(0,0,0,.6); display:grid; place-items:center; color:var(--text-faint); }
  .np-art img { width:100%; height:100%; object-fit:cover; display:block; }
  .np-meta { text-align:center; margin-bottom:14px; }
  .np-title { font-size:22px; font-weight:800; letter-spacing:-.4px; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np-artist { color:var(--text-dim); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np-bar-row { display:flex; align-items:center; gap:10px; margin:2px 0 6px; }
  .np-bar-row .time { min-width:40px; }
  .np-controls { display:flex; align-items:center; justify-content:center; gap:22px; padding:10px 0 4px; }
  .np-controls .ctrl { padding:10px; font-size:19px; }
  .np-play { width:64px; height:64px; border-radius:50%; background:#fff; color:#000; display:grid; place-items:center; }
  .np-play:active { transform:scale(.96); }
  .np-actions { display:flex; align-items:center; justify-content:center; gap:26px; padding:10px 0 6px; }
  .np-actions .like-btn { font-size:19px; }
  .np-tabs { display:flex; gap:8px; justify-content:center; padding:8px 0 10px; }
  .np-tab { padding:7px 16px; border-radius:16px; font-size:13px; font-weight:700; color:var(--text-dim); background:rgba(255,255,255,.06); }
  .np-tab.on { color:#000; background:var(--accent); }
  .np-list { flex:none; padding-bottom:20px; }
  .np-line { display:flex; gap:10px; align-items:baseline; width:100%; text-align:left; padding:9px 10px; border-radius:8px; }
  .np-line span.n { color:var(--text-faint); font-size:12px; min-width:18px; text-align:right; font-variant-numeric:tabular-nums; }
  .np-line.current { background:rgba(255,107,0,.12); }
  .np-line.current .t { color:var(--accent); }
  .np-empty { color:var(--text-faint); text-align:center; padding:28px 8px; font-size:13px; }
  .np-line .t { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:600; }
  .np-line .n { display:grid; place-items:center; }
  .ly-verse { color:var(--text); font-size:16px; font-weight:700; line-height:1.45; padding:9px 4px; opacity:.55; transition:opacity .2s; }
  .ly-verse.on { opacity:1; color:var(--accent); }
  .drag-handle-off { transition:transform .2s; }
}
</style>

<body>
<div id="app"></div>
<div id="np"></div>
<audio id="audio" preload="auto" playsinline></audio>
<div class="toast" id="toast" style="display:none"></div>
<script src="native.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const audio = $('audio');
// Inside the Android shell, native.js is loaded first and replaces both with
// local-file versions; on the desktop they keep pointing at the web server.
window.spinityStreamSrc = window.spinityStreamSrc || function (t) { return '/api/stream?id=' + encodeURIComponent(t.id); };
window.spinityDownloadHref = window.spinityDownloadHref || function (t) { return '/api/download?id=' + encodeURIComponent(t.id); };
let token = localStorage.getItem('spinity-web:token') || '';
let me = null;
let tracks = [], playlists = [], view = 'home', query = '';
let queue = [], index = -1, shuffle = false, repeat = 'off';
let liked = new Set();
let ytResults = [], ytSearching = false;
let currentList = [];
const savingIds = new Set(), savedIds = new Set();
const byId = new Map();
let toastTimer = null;

// ---- Mobile / sheet / PWA state ----
let npOpen = false, npTab = 'queue', npPushed = false;
let npLineIdx = -1;
const lyricsCache = new Map();     // track id -> { synced: [{t,text}]|null, plain: string[]|null, failed?: true }
const lyricsPending = new Set();
let deferredInstall = null;        // beforeinstallprompt event
const isMobile = () => window.matchMedia('(max-width:780px)').matches;
const absUrl = (u) => !u ? '' : (/^https?:/i.test(u) ? u : (u.startsWith('/') ? location.origin + u : ''));

const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const thumb = (t) => t.thumbnail ? `<img loading="lazy" src="${esc(t.thumbnail)}" alt="" onerror="this.remove()" />` : '';
const noteFallback = (cls) => `<span class="${cls}" style="display:grid;place-items:center;color:var(--text-faint)">${IC.music(22)}</span>`;
// Range-track background: accent up to pct, muted grey for the rest (beats
// the global input:hover rule exactly like the desktop app's inline fill).
const fillBg = (pct) => { const p = Math.max(0, Math.min(100, pct)).toFixed(2); return { background: `linear-gradient(to right, var(--accent) 0 ${p}%, #4d4d4d ${p}% 100%)` }; };

// ---- Waveform (same algorithm & look as the app's Waveform.tsx) ----
const PEAK_COUNT = 180;
const MAX_DECODE_BYTES = 100 * 1024 * 1024;
const WAVE_STORE = 'spinity-web:waves';
const wavePeaks = new Map();          // track id -> { d: durationSec, p: peaks[] }
let waveTimer = 0, waveGen = 0, waveFitTimer = 0;
const waveUi = new Map();             // seek-bar element id -> { mode, lastPlayed }
try {
  const raw = JSON.parse(localStorage.getItem(WAVE_STORE) || '{}');
  for (const [k, v] of Object.entries(raw)) if (v && Array.isArray(v.p) && v.p.length) wavePeaks.set(k, v);
} catch {}
function persistWaves() {
  try {
    const o = {};
    for (const [k, v] of wavePeaks) o[k] = v;
    const keys = Object.keys(o);
    while (keys.length > 40) delete o[keys.shift()];
    localStorage.setItem(WAVE_STORE, JSON.stringify(o));
  } catch {}
}

// ---- Codec tag (server-side ffmpeg probe, cached per track) ----
const codecLabels = new Map();        // track id -> { label, title }
const codecPending = new Set();

/* Same hand-rolled SVG set as the desktop app (no emoji icons). */
const svgW = (inner, size, fill) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" ${fill ? 'stroke="none"' : 'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'}>${inner}</svg>`;
const IC = {
  play: (s = 18) => svgW('<path d="M7 4.5v15l13-7.5z" />', s, true),
  pause: (s = 18) => svgW('<rect x="6" y="4.5" width="4" height="15" rx="1" /><rect x="14" y="4.5" width="4" height="15" rx="1" />', s, true),
  prev: (s = 18) => svgW('<path d="M6 5h2.5v14H6z" /><path d="M19 5.5v13L9.5 12z" />', s, true),
  next: (s = 18) => svgW('<path d="M15.5 5H18v14h-2.5z" /><path d="M5 5.5v13L14.5 12z" />', s, true),
  shuffle: (s = 17) => svgW('<path d="M16 3h5v5" /><path d="M4 20L21 3" /><path d="M21 16v5h-5" /><path d="M15 15l6 6" /><path d="M4 4l5 5" />', s),
  repeat: (s = 17) => svgW('<path d="M17 2l4 4-4 4" /><path d="M3 11V9a4 4 0 014-4h14" /><path d="M7 22l-4-4 4-4" /><path d="M21 13v2a4 4 0 01-4 4H3" />', s),
  vol: (s = 17) => svgW('<path d="M11 5L6 9H2v6h4l5 4z" /><path d="M15.5 8.5a5 5 0 010 7" /><path d="M18.5 5.5a9 9 0 010 13" />', s),
  mute: (s = 17) => svgW('<path d="M11 5L6 9H2v6h4l5 4z" /><path d="M22 9l-6 6" /><path d="M16 9l6 6" />', s),
  search: (s = 17) => svgW('<circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />', s),
  home: (s = 17) => svgW('<path d="M3 10.4L12 3l9 7.4" /><path d="M5.6 9.4V20a1 1 0 001 1H10v-5.4h4V21h3.4a1 1 0 001-1V9.4" />', s),
  library: (s = 17) => svgW('<path d="M4 3h3v18H4z" /><path d="M10 3h3v18h-3z" /><path d="M16.5 3.6l4 17.4" />', s),
  plus: (s = 15) => svgW('<path d="M12 5v14" /><path d="M5 12h14" />', s),
  x: (s = 14) => svgW('<path d="M6 6l12 12" /><path d="M18 6L6 18" />', s),
  heart: (s = 15, on = false) => on
    ? `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A4.5 4.5 0 0017.5 4c-1.8 0-3.4 1-4.2 2.4h-2.6C9.9 5 8.3 4 6.5 4A4.5 4.5 0 002 8.5c0 2.3 1.5 4 3 5.5l7 7z" /></svg>`
    : svgW('<path d="M19 14c1.5-1.5 3-3.2 3-5.5A4.5 4.5 0 0017.5 4c-1.8 0-3.4 1-4.2 2.4h-2.6C9.9 5 8.3 4 6.5 4A4.5 4.5 0 002 8.5c0 2.3 1.5 4 3 5.5l7 7z" />', s),
  music: (s = 24) => svgW('<circle cx="7" cy="18" r="3" /><circle cx="18" cy="15.5" r="3" /><path d="M10 18V7l11-2.5v11" />', s),
  chevL: (s = 15) => svgW('<path d="M15 5l-7 7 7 7" />', s),
  chevR: (s = 15) => svgW('<path d="M9 5l7 7-7 7" />', s),
  clock: (s = 14) => svgW('<circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />', s),
  logout: (s = 15) => svgW('<path d="M9 21H5a1 1 0 01-1-1V4a1 1 0 011-1h4" /><path d="M16 17l5-5-5-5" /><path d="M21 12H9" />', s),
  dl: (s = 15) => svgW('<path d="M12 3v11" /><path d="M7 9.5l5 5 5-5" /><path d="M5 20h14" />', s),
  chevD: (s = 20) => svgW('<path d="M6 9l6 6 6-6" />', s),
  install: (s = 15) => svgW('<path d="M12 3v11" /><path d="M7 9.5l5 5 5-5" /><path d="M4 20h16" />', s)
};

function toast(msg, err = false) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast' + (err ? ' error' : '');
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2600);
}

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) } });
  if (r.status === 401) { logout(); throw new Error('login required'); }
  return r;
}
function logout() {
  if (token) fetch('/api/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } }).catch(() => {});
  token = ''; localStorage.removeItem('spinity-web:token');
  me = null; audio.pause(); queue = []; index = -1;
  if (npOpen) closeSheet();
  render();
}

function renderLogin(mode = 'login', err = '') {
  $('app').innerHTML = `<div class="login-wrap"><div class="login-card">
    <div class="sp-logo" style="justify-content:center"><span class="sp-logo-dot">S</span>Spinity</div>
    <h1>${mode === 'login' ? 'Log in to Spinity' : 'Sign up for Spinity'}</h1>
    <p class="hint" style="text-align:center;margin-bottom:6px">Your desktop app login works here too.</p>
    <div class="login-tabs"><button class="${mode === 'login' ? 'on' : ''}" id="tab-login">Log in</button><button class="${mode === 'register' ? 'on' : ''}" id="tab-reg">Sign up</button></div>
    <div class="field"><label>${mode === 'login' ? 'Username or email' : 'Username'}</label><input id="f-login" autocomplete="username" /></div>
    ${mode === 'register' ? '<div class="field"><label>Display name (optional)</label><input id="f-name" /></div>' : ''}
    <div class="field"><label>Password${mode === 'register' ? ' (min 6 chars)' : ''}</label><input id="f-pass" type="password" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}" /></div>
    ${err ? `<p class="error-text">${esc(err)}</p>` : ''}
    <button class="btn" style="width:100%;justify-content:center" id="f-go">${mode === 'login' ? 'Log in' : 'Sign up'}</button>
  </div></div>`;
  $('tab-login').onclick = () => renderLogin('login');
  $('tab-reg').onclick = () => renderLogin('register');
  const go = async () => {
    try {
      const url = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
      const body = mode === 'login'
        ? { login: $('f-login').value.trim(), password: $('f-pass').value }
        : { username: $('f-login').value.trim(), password: $('f-pass').value, displayName: ($('f-name') || {}).value || '' };
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) { renderLogin(mode, await r.text()); return; }
      const j = await r.json();
      token = j.token; localStorage.setItem('spinity-web:token', token);
      await boot();
    } catch { renderLogin(mode, 'Network error — is the server up?'); }
  };
  $('f-go').onclick = go;
  $('f-pass').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

function libRow(p, activeId) {
  const art = p.kind === 'liked' ? `<span class="sp-lib-art"><span class="sp-lib-tile-liked">${IC.heart(20, true)}</span></span>`
    : `<span class="sp-lib-art">${thumb(byId.get(p.firstId) || {}) || IC.music(22)}</span>`;
  return `<button class="sp-lib-row${activeId === p.id ? ' active' : ''}" data-lib="${esc(p.id)}">${art}
    <span class="sp-lib-meta"><span class="sp-lib-title">${esc(p.title)}</span><br /><span class="sp-lib-sub">${esc(p.sub)}</span></span></button>`;
}

function libItems() {
  return [
    { id: 'liked', kind: 'liked', title: 'Liked Songs', sub: `Playlist • ${liked.size} liked` },
    ...playlists.map((p) => ({ id: 'pl:' + p.id, kind: 'pl', title: p.name, sub: `Playlist • ${p.trackIds.length} songs`, firstId: p.trackIds[0] }))
  ];
}

function shell(inner) {
  const libList = libItems();
  const activeLib = view === 'liked' ? 'liked' : view.startsWith('playlist:') ? 'pl:' + view.slice(9) : '';
  const cur = queue[index];
  const codec = cur ? (codecLabels.get(cur.id) || null) : null;
  const next5 = queue.slice(index + 1, index + 6);
  return `<div class="sp-app"><div class="sp-rail">
    <div class="sp-rail-card">
      <div class="sp-logo"><span class="sp-logo-dot">S</span>Spinity</div>
      <button class="nav-btn${view === 'home' ? ' active' : ''}" data-view="home">${IC.home(20)} Home</button>
      <button class="nav-btn${view === 'search' ? ' active' : ''}" data-view="search">${IC.search(20)} Search</button>
    </div>
    <div class="sp-library">
      <div class="sp-library-head">${IC.library(20)} Your Library
        <button class="sp-create-pill" id="pl-add">${IC.plus(13)} Create</button>
      </div>
      <div class="sp-chips"><span class="sp-chip">Playlists</span><span class="sp-chip">${tracks.length} songs</span></div>
      <div class="sp-library-list">${libList.map((p) => libRow(p, activeLib)).join('')}</div>
      <div class="sidebar-user"><span class="avatar">${esc((me.user.name || '?')[0].toUpperCase())}</span>
        <span class="sp-lib-meta"><span class="sp-lib-title">${esc(me.user.name)}</span></span>
        <button class="like-btn" id="btn-logout" title="Log out">${IC.logout(15)}</button>
      </div>
    </div>
  </div>
  <div class="sp-center">
    <div class="sp-topbar">
      <button class="sp-nav-arrow" id="nav-back" title="Back">${IC.chevL(15)}</button>
      <button class="sp-nav-arrow" id="nav-fwd" title="Forward">${IC.chevR(15)}</button>
      <button class="sp-home-btn${view === 'home' ? ' active' : ''}" data-view="home" title="Home">${IC.home(22)}</button>
      <div class="sp-search-pill">${IC.search(17)}<input id="q-top" placeholder="What do you want to play?" value="${esc(query)}" /></div>
      <div class="sp-topbar-right"><button class="avatar" id="me-avatar" title="Account">${esc((me.user.name || '?')[0].toUpperCase())}</button></div>
    </div>
    <div class="sp-page" id="main">${inner}</div>
  </div>
  <aside class="sp-right">
    <h3>${cur ? esc(cur.title) : 'Now playing'}</h3>
    <div class="sp-np-art">${cur && cur.thumbnail ? `<img src="${esc(cur.thumbnail)}" alt="" onerror="this.remove()" />` : IC.music(48)}</div>
    ${cur ? `<div class="sp-np-title" title="${esc(cur.title)}">${esc(cur.title)}</div><div class="sp-np-artist">${esc(cur.artist)}</div>` : '<p class="hint" style="margin-top:12px">Nothing playing — pick something from Home, Search or your Library.</p>'}
    ${next5.length ? '<h3 style="margin-top:20px">Next up</h3>' + next5.map((t) => `<button class="sp-next-row" data-next="${esc(t.id)}">${thumb(t) || '<span class="sp-lib-art">' + IC.music(20) + '</span>'}<span style="min-width:0"><span class="track-title" style="font-size:13px">${esc(t.title)}</span><br /><span class="track-artist" style="font-size:12px">${esc(t.artist)}</span></span></button>`).join('') : ''}
  </aside>
  <footer class="player" id="mini-player">
    <div class="mb-progress" id="mbprog"></div>
    <div class="now-playing">
      ${cur ? `<span id="now-art">${cur.thumbnail ? `<img class="now-artwork" src="${esc(cur.thumbnail)}" onerror="this.remove()" />` : noteFallback('now-artwork')}</span>
      <div class="track-main">

function bindShell() {
  document.querySelectorAll('[data-view]').forEach((b) => b.onclick = () => { view = b.dataset.view; render(); });
  document.querySelectorAll('[data-lib]').forEach((b) => b.onclick = () => {
    const id = b.dataset.lib;
    view = id === 'liked' ? 'liked' : 'playlist:' + id.slice(3);
    render();
  });
  document.querySelectorAll('[data-next]').forEach((b) => b.onclick = () => {
    const i = queue.findIndex((t) => t.id === b.dataset.next);
    if (i >= 0) { index = i; loadTrack(queue[index], true); }
  });
  $('btn-logout').onclick = logout;
  const meAv = $('me-avatar');
  if (meAv) meAv.onclick = (e) => accountMenu(e.currentTarget);
  $('nav-back').onclick = () => history.back();
  $('nav-fwd').onclick = () => history.forward();
  const createPl = async () => {
    const name = prompt('Playlist name:');
    if (!name || !name.trim()) return;
    const r = await api('/api/playlists', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: name.trim() }) });
    if (r.ok) { const p = await r.json(); playlists.push(p); view = 'playlist:' + p.id; render(); }
  };
  ['pl-add', 'pl-add2'].forEach((id) => { const el = $(id); if (el) el.onclick = createPl; });
  const inst = $('btn-install');
  if (inst) inst.onclick = async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    const c = await deferredInstall.userChoice.catch(() => null);
    if (c && c.outcome === 'accepted') deferredInstall = null;
    render();
  };
  const mini = $('mini-player');
  if (mini) mini.onclick = (e) => { if (e.target.closest('button, input, a')) return; openSheet(); };
  const mbl = $('mb-like');
  if (mbl) mbl.onclick = (e) => { e.stopPropagation(); const t = queue[index]; if (t) toggleLike(t.id); };
  const qt = $('q-top');
  qt.oninput = () => { query = qt.value; if (view !== 'search') { view = 'search'; render(); } else { render(); const n = $('q-top'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };
  qt.onkeydown = (e) => { if (e.key === 'Enter' && query.trim()) ytSearch(query.trim()); };
}

// ---- Waveform seek bar (paint + pointer/keyboard seek, like Waveform.tsx) ----
// Two instances: #bar2 (desktop bar / mini player) and #npbar (phone sheet).
const waveTargets = () => ['bar2', 'npbar'].map((id) => $(id)).filter(Boolean);
function wavePct() {
  const d = audio.duration || (queue[index] && queue[index].durationSec) || 0;
  return d > 0 ? Math.max(0, Math.min(1, audio.currentTime / d)) : 0;
}
// Bars are 1px wide + 2px gap (~3px pitch), so 180 of them need ~540px: sample
// the list down to what the element can actually hold. Without this a narrow
// sheet row overflows its box, runs over the end time and pans the whole sheet.
function fitPeaks(peaks, el) {
  const w = el.clientWidth || 0;
  if (!w) return peaks;
  const maxN = Math.max(16, Math.floor((w + 2) / 3));
  if (peaks.length <= maxN) return peaks;
  const step = Math.ceil(peaks.length / maxN);
  const out = [];
  for (let i = 0; i < peaks.length; i += step) out.push(peaks[i]);
  return out;
}
function paintWave() {
  const t = queue[index];
  const peaks = t ? (wavePeaks.get(t.id) || {}).p : null;
  const dur = audio.duration || (t && t.durationSec) || 0;
  const pct = wavePct();
  for (const el of waveTargets()) {
    const ui = waveUi.get(el.id) || { mode: 'flat', lastPlayed: -1 };
    waveUi.set(el.id, ui);
    el.setAttribute('role', 'slider');
    el.setAttribute('aria-label', 'Seek');
    el.setAttribute('aria-valuemin', '0');
    el.setAttribute('aria-valuemax', String(Math.round(dur)));
    el.setAttribute('aria-valuenow', String(Math.round(audio.currentTime || 0)));
    if (queue.length) { el.tabIndex = 0; el.removeAttribute('aria-disabled'); }
    else { el.removeAttribute('tabindex'); el.setAttribute('aria-disabled', 'true'); }
    if (peaks && peaks.length) {
      ui.mode = 'bars';
      el.className = 'waveform';
      ui.bars = fitPeaks(peaks, el);
      ui.lastPlayed = Math.floor(pct * ui.bars.length);
      el.innerHTML = ui.bars.map((v, i) => `<span class="wave-bar${i < ui.lastPlayed ? ' played' : ''}" style="height:${Math.max(8, Math.round(v * 100))}%"></span>`).join('');
    } else {
      ui.mode = 'flat';
      ui.bars = null;
      ui.lastPlayed = -1;
      el.className = 'wave-flat';
      el.innerHTML = '';
      const p = (pct * 100).toFixed(2);
      el.style.background = `linear-gradient(to right, var(--accent) 0 ${p}%, #4d4d4d ${p}% 100%)`;
    }
    bindSeek(el);
  }
}
// Re-fit bars on window/orientation changes (a narrower bar needs fewer).
window.addEventListener('resize', () => {
  clearTimeout(waveFitTimer);
  waveFitTimer = setTimeout(() => {
    if (waveTargets().some((el) => (waveUi.get(el.id) || {}).mode === 'bars')) paintWave();
  }, 200);
});
function seekAt(el, clientX) {
  if (!el) return;
  const d = audio.duration || (queue[index] && queue[index].durationSec) || 0;
  if (d <= 0) return;
  const r = el.getBoundingClientRect();
  audio.currentTime = Math.max(0, Math.min(1, (clientX - r.left) / r.width)) * d;
}
function bindSeek(el) {
  let dragging = false;
  el.style.touchAction = 'none';
  el.onpointerdown = (e) => { dragging = true; try { el.setPointerCapture && el.setPointerCapture(e.pointerId); } catch {} seekAt(el, e.clientX); };
  el.onpointermove = (e) => { if (dragging) seekAt(el, e.clientX); };
  el.onpointerup = el.onpointercancel = () => { dragging = false; };
  el.onkeydown = (e) => {
    const d = audio.duration || (queue[index] && queue[index].durationSec) || 0;
    if (e.key === 'ArrowLeft') { e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - 5); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); audio.currentTime = Math.min(d, audio.currentTime + 5); }
  };
}
// Times + waveform played-state; called on every timeupdate (cheap delta update).
function updateProgress() {
  for (const id of ['t-cur', 'np-t-cur']) { const tc = $(id); if (tc) tc.textContent = fmt(audio.currentTime || 0); }
  if (audio.duration) for (const id of ['t-end', 'np-t-end']) { const te = $(id); if (te) te.textContent = fmt(audio.duration); }
  const pct = wavePct();
  for (const el of waveTargets()) {
    const ui = waveUi.get(el.id) || { mode: 'flat', lastPlayed: -1 };
    if (ui.mode === 'flat') {
      const p = (pct * 100).toFixed(2);
      el.style.background = `linear-gradient(to right, var(--accent) 0 ${p}%, #4d4d4d ${p}% 100%)`;
    } else {
      const pk = ui.bars; // the fitted, actually-rendered bar values
      if (pk && pk.length && el.children.length) {
        const played = Math.floor(pct * pk.length);
        if (played !== ui.lastPlayed) {
          const bars = el.children;
          const from = Math.max(0, Math.min(ui.lastPlayed, played));
          const to = Math.min(bars.length, Math.max(ui.lastPlayed, played));
          for (let i = from; i < to; i++) if (bars[i]) bars[i].classList.toggle('played', i < played);
          ui.lastPlayed = played;
        }
      }
    }
    el.setAttribute('aria-valuenow', String(Math.round(audio.currentTime || 0)));
  }
  paintMiniProgress(pct);
  updateLyricsHighlight();
  updatePositionState();
}
// Peaks: deferred 3s past track start (never contend with first bytes), then
// decode full stream client-side — same steps as the app, minus its IPC cache.
function scheduleWaves(t) {
  clearTimeout(waveTimer);
  const gen = ++waveGen;
  if (!t || wavePeaks.has(t.id)) return;
  waveTimer = setTimeout(() => { void computeWaves(t, gen); }, 3000);
}
async function computeWaves(t, gen) {
  try {
    const res = await fetch('/api/stream?id=' + encodeURIComponent(t.id));
    if (!res.ok) return;
    const len = Number(res.headers.get('content-length') || 0);
    if (len > MAX_DECODE_BYTES) return;
    const buf = await res.arrayBuffer();
    if (buf.byteLength === 0 || buf.byteLength > MAX_DECODE_BYTES || gen !== waveGen) return;
    const ctx = new OfflineAudioContext(1, 44100, 44100);
    const decoded = await ctx.decodeAudioData(buf);
    if (gen !== waveGen || !queue[index] || queue[index].id !== t.id) return;
    const data = decoded.getChannelData(0);
    const out = [];
    const bucket = Math.max(1, Math.floor(data.length / PEAK_COUNT));
    for (let i = 0; i < PEAK_COUNT; i++) {
      const start = i * bucket;
      let max = 0;
      const end = Math.min(data.length, start + bucket);
      for (let j = start; j < end; j += 4) {
        const v = Math.abs(data[j]);
        if (v > max) max = v;
      }
      out.push(Math.min(1, Math.sqrt(max) * 1.1));
    }
    wavePeaks.set(t.id, { d: Math.round(t.durationSec || decoded.duration || 0), p: out });
    persistWaves();
    if (queue[index] && queue[index].id === t.id) paintWave();
  } catch {}
}
// ---- Codec tag ("MP3 · 44.1 kHz · 320 kbps") via the server's ffmpeg probe ----
async function probeCodec(t) {
  if (!t || codecLabels.has(t.id) || codecPending.has(t.id)) return;

    if (r.ok) {

      if (j && j.label) codecLabels.set(t.id, j);
    }
  } catch {}
  codecPending.delete(t.id);
  const cur = queue[index];
  if (cur && cur.id === t.id) paintCodec();
}

  loadTrack(queue[index], true);
}

// ---- Lyrics (lrclib via the server, cached per track) ----
function parseLrc(text) {
  const out = [];
  for (const raw of String(text).split(/\r?\n/)) {
    const m = /^\[(\d{1,2}):(\d{1,2}(?:\.\d+)?)\]\s?(.*)$/.exec(raw.trim());
    if (m) { out.push({ t: Number(m[1]) * 60 + Number(m[2]), text: (m[3] || '').trim() }); continue; }
    const line = raw.trim();
    if (line && !/^\[[a-z]+:/i.test(line)) out.push({ t: null, text: line });
  }
  const timed = out.filter((l) => l.t != null).sort((a, b) => a.t - b.t);
  return timed.length >= 4 ? timed : null;
}
async function ensureLyrics(t) {
  if (!t || lyricsPending.has(t.id)) return;
  const existing = lyricsCache.get(t.id);
  if (existing && !existing.failed) return; // failed lookups retry when the tab is opened again
  if (existing) lyricsCache.delete(t.id);
  lyricsPending.add(t.id);
  try {
    const r = await fetch('/api/lyrics?id=' + encodeURIComponent(t.id));
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    const synced = j.synced ? parseLrc(j.synced) : null;
    const plain = j.plain ? String(j.plain).split(/\r?\n/).filter((l) => l.trim()) : null;
    lyricsCache.set(t.id, { synced, plain, failed: !synced && !plain });
  } catch {
    lyricsCache.set(t.id, { synced: null, plain: null, failed: true });
  }
  lyricsPending.delete(t.id);
  const cur = queue[index];
  if (npOpen && npTab === 'lyrics' && cur && cur.id === t.id) renderNP();
}
function updateLyricsHighlight() {
  if (!npOpen || npTab !== 'lyrics') return;
  const cur = queue[index];

  if (!lyr || !lyr.synced || !lyr.synced.length) return;
  const lines = lyr.synced;
  let idx = -1;
  for (let i = 0; i < lines.length; i++) { if (lines[i].t <= audio.currentTime + 0.15) idx = i; else break; }
  if (idx === npLineIdx) return;
  npLineIdx = idx;
  const wrap = $('np-list');
  if (!wrap) return;
  const els = wrap.querySelectorAll('.ly-verse');
  els.forEach((el, i) => el.classList.toggle('on', i === idx));
  if (els[idx] && els[idx].scrollIntoView) els[idx].scrollIntoView({ block: 'center', behavior: 'smooth' });
}

// ---- Media Session (lockscreen / notification controls) ----
function setupMediaSession() {
  const ms = navigator.mediaSession;
  if (!ms) return;
  const set = (a, f) => { try { ms.setActionHandler(a, f); } catch {} };
  set('play', () => audio.play().catch(() => {}));
  set('pause', () => audio.pause());
  set('stop', () => audio.pause());
  set('previoustrack', () => { if (audio.currentTime > 3) audio.currentTime = 0; else step(-1); });
  set('nexttrack', () => step(1));
  set('seekto', (d) => { if (d && d.seekTime != null) audio.currentTime = d.seekTime; });
  set('seekbackward', (d) => { audio.currentTime = Math.max(0, audio.currentTime - ((d && d.seekOffset) || 10)); });
  set('seekforward', (d) => { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + ((d && d.seekOffset) || 10)); });
}
function updateMediaSession(t) {
  const ms = navigator.mediaSession;
  if (!ms) return;
  const cur = t || queue[index];
  if (!cur) { try { ms.metadata = null; } catch {} return; }
  try {
    ms.metadata = new MediaMetadata({
      title: cur.title || 'Unknown',
      artist: cur.artist || 'Unknown artist',
      album: 'Spinity',
      artwork: cur.thumbnail ? [{ src: absUrl(cur.thumbnail), sizes: '512x512', type: 'image/jpeg' }] : []
    });
  } catch {}
  updateMediaPlaybackState();
}
function updateMediaPlaybackState() {
  const ms = navigator.mediaSession;
  if (!ms) return;
  try { ms.playbackState = audio.paused ? 'paused' : 'playing'; } catch {}
}
let msLastPos = 0;
function updatePositionState() {
  const ms = navigator.mediaSession;
  if (!ms || !ms.setPositionState) return;
  const d = audio.duration;
  if (!d || !isFinite(d) || d <= 0) return;
  const now = Date.now();
  if (now - msLastPos < 900) return;
  msLastPos = now;
  try { ms.setPositionState({ duration: d, playbackRate: 1, position: Math.min(Math.max(0, audio.currentTime), d) }); } catch {}
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstall = e;
  if (view === 'library') render();
});
window.addEventListener('appinstalled', () => {
  deferredInstall = null;
  toast('Spinity installed ✓');
  render();
});
if (window.isSecureContext && 'serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/player/sw.js').catch(() => {}); });
}
setupMediaSession();

let loadChipTimer = null;
const show = (id, v) => { const el = $(id); if (el) el.style.display = v; };
audio.onwaiting = () => { clearTimeout(loadChipTimer); loadChipTimer = setTimeout(() => show('bar-chip', 'inline-block'), 400); };
audio.onplaying = () => { clearTimeout(loadChipTimer); show('bar-chip', 'none'); show('bar-err', 'none'); };
audio.onerror = () => { if (audio.src) show('bar-err', 'inline-block'); };
audio.ontimeupdate = updateProgress;
audio.onloadedmetadata = updateProgress;
audio.onplay = () => { syncPlayButtons(); updateMediaPlaybackState(); };
audio.onpause = () => { syncPlayButtons(); updateMediaPlaybackState(); };
audio.onended = () => { if (repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); } else if (repeat === 'all' || index < queue.length - 1) step(1); };
audio.volume = 0.9;

(async () => {
  if (!token) { renderLogin(); return; }
  try { await boot(); }
  catch { renderLogin(); }
})();
</script>
</body>
</html>
