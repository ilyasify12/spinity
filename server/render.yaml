services:
  - type: web
    name: spinity-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: "*"
      - key: STUN_SERVERS
        value: '[{"urls":"stun:stun.l.google.com:19302"}]'
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
