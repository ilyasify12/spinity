# electron-builder — Windows packaging
#
#   npm run build      bundle only, no installer
#   npm run dist       full NSIS installer -> release/
#   npm run dist:dir   unpacked folder, fastest way to sanity-check packaging
#
# AUTO-UPDATE — enabled via electron-updater + GitHub Releases.
# Unsigned builds still trigger SmartScreen but updater works without signing.
appId: com.spinity.app
productName: Spinity

directories:
  output: release
  # Put build/icon.ico here (256x256 or larger). Without it electron-builder
  # falls back to the stock Electron icon.
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

# The app is code, not data: the music library lives in %APPDATA%, so bundling
# into an asar archive is safe and makes the install tamper-resistant.
asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

# Ship the logo with the installer so the packaged app can show it.
extraResources:
  - from: logo.png
    to: logo.png
  - from: build/icon.png
    to: icon.png

nsis:
  # ONE-CLICK vs WIZARD: these are mutually exclusive.
  #   oneClick: true  -> silent, single-button install, no directory choice
  #   oneClick: false -> wizard (what is configured here)
  oneClick: false

  # PER-USER vs PER-MACHINE:
  #   perMachine: false -> installs to %LOCALAPPDATA%\Programs, no admin needed
  #   perMachine: true  -> installs to Program Files, requires elevation
  # Per-user is the right default for a music app used by one person.
  perMachine: false

  allowToChangeInstallationDirectory: true
  allowElevation: true

  # Shortcuts.
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Spinity

  # Keep %APPDATA%\spinity on uninstall so the music library survives.
  deleteAppDataOnUninstall: false
  uninstallDisplayName: Spinity

publish:
  - provider: github
    owner: ilyasify12
    repo: spinity
    private: false
